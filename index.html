<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#2f6fd6">

<link rel="icon" href="icon-192.png">
<title>Budget Ledger</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1e;--mut:#6b6a66;--bd:#e3e1db;--acc:#2f6fd6;--accbg:#e8f0fc;--ok:#2d7a3e;--okbg:#e6f3e8;--warn:#b0561a;--warnbg:#fbeee2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ecebe7;--mut:#a3a29c;--bd:#33332f;--acc:#7aa7f0;--accbg:#1f2c44;--ok:#6fcf86;--okbg:#1d3324;--warn:#f0a56e;--warnbg:#3a2a1d}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ecebe7;--mut:#a3a29c;--bd:#33332f;--acc:#7aa7f0;--accbg:#1f2c44;--ok:#6fcf86;--okbg:#1d3324;--warn:#f0a56e;--warnbg:#3a2a1d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:.5px solid var(--bd)}
header h1{font-size:18px;font-weight:500;margin:0 0 6px}
.mn{display:flex;align-items:center;gap:10px}
.mn b{font-weight:500;min-width:92px;text-align:center}
main{padding:12px 16px;max-width:760px;margin:0 auto}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:.5px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dng{color:var(--warn)}
input,select,textarea{background:var(--card);border:.5px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;overflow:hidden;margin:0 0 12px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:.5px solid var(--bd);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .m{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;background:var(--accbg);color:var(--acc);margin-right:4px}
.chip.w{background:var(--warnbg);color:var(--warn)}
.chip.o{background:var(--okbg);color:var(--ok)}
.met{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}
.met div{background:var(--card);border:.5px solid var(--bd);border-radius:8px;padding:10px 12px}
.met small{display:block;font-size:12px;color:var(--mut)}
.met b{font-size:18px;font-weight:500}
.met input{border:0;padding:0;font-size:18px;font-weight:500;background:transparent}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--mut);text-align:right;padding:8px 8px;border-bottom:.5px solid var(--bd);font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;border-bottom:.5px solid var(--bd);text-align:right}
tr.g td{background:var(--bg);font-weight:500;cursor:pointer}
td.ind{padding-left:20px}
td input{width:84px;text-align:right;padding:4px 6px;font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--bd);min-width:50px}
.bar i{display:block;height:5px;border-radius:3px}
.ok{color:var(--ok)}.wn{color:var(--warn)}
.seg{display:flex;margin:0 0 12px}
.seg button{flex:1;border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 0;font-size:12px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:500}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;background:var(--acc);color:#fff;font-size:28px;line-height:1;border:0;z-index:7}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;display:none;max-width:90%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rc{background:var(--card);border:.5px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer}
.rc img{width:100%;height:120px;object-fit:cover;display:block;background:var(--bd)}
.rc div{padding:6px 8px;font-size:12px}
.th{width:56px;height:56px;object-fit:cover;border-radius:8px;margin:4px 6px 0 0}
.full{width:100%;border-radius:8px;margin:8px 0}
.banner{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:13px}
.sub{display:flex;justify-content:space-between;padding:6px 12px 6px 24px;font-size:12px;color:var(--mut);cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" onclick="if(event.target.id==='modal')closeModal()"></div>
<div id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="A.addPhotos(this)">
<input type="file" id="lib" accept="image/*" multiple hidden onchange="A.addPhotos(this)">
<input type="file" id="restore" accept=".json,application/json" hidden onchange="A.restore(this)">
<script>
const LS='budgetLedger.v1';
const APP_VERSION='7';
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const today=()=>{const d=new Date();return ym(d)+'-'+pad(d.getDate())};
const isoOf=d=>ym(d)+'-'+pad(d.getDate());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const monthLabel=m=>{const p=m.split('-');return MN[+p[1]-1]+' '+p[0]};
const addMonths=(m,n)=>{const p=m.split('-').map(Number);return ym(new Date(p[0],p[1]-1+n,1))};
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().trim();
const dayDiff=(a,b)=>Math.abs((new Date(a)-new Date(b))/864e5);

const DEFAULT_CATS=[
['rent','Rent',''],['shared_in','Shared account contribution',''],
['electricity','Electricity','Utilities'],['gas','Gas','Utilities'],['internet','Internet','Utilities'],
['cell_us','Cellphone (US)','Phone'],['cell_jp','Cellphone (JP)','Phone'],
['car_ins','Car insurance','Insurance'],['renters_ins','Renters insurance','Insurance'],
['grocery','Grocery','Food'],['lunch','Lunch','Food'],['biz_lunch','Business lunch','Food'],['bulk','Bulk','Food'],['drinks','Drinks','Food'],['restaurant','Restaurant','Food'],
['spotify','Spotify','Entertainment'],['prime','Amazon Prime (JP)','Entertainment'],['cloud','Cloud (Apple, etc.)','Entertainment'],['bunpro','Bunpro','Entertainment'],['claude','Claude','Entertainment'],['nintendo','Nintendo','Entertainment'],['ent_misc','Misc (entertainment)','Entertainment'],
['metro','Metro','Travel'],['tolls','Tolls','Travel'],['ride','Ride share','Travel'],['parking','Parking','Travel'],['flights','Flights / trains / car rentals','Travel'],['hotels','Hotels / Airbnb','Travel'],['travel_misc','Misc (travel)','Travel'],
['physical','Physical','Health'],['mental','Mental','Health'],['dental','Dental','Health'],
['shopping','Shopping',''],['haircut','Haircut',''],['misc','Misc','']
].map(a=>({id:a[0],name:a[1],g:a[2]}));
const DEFAULT_RULES=[
['ローソン','restaurant'],['lawson','restaurant'],['ファミリーマート','restaurant'],['ファミマ','restaurant'],['familymart','restaurant'],['セブン','restaurant'],['7-eleven','restaurant'],['ミニストップ','restaurant'],['ウーバーイーツ','restaurant'],['uber eats','restaurant'],['サカガミ','restaurant'],
['ライフ','grocery'],['東急ストア','grocery'],['旬八青果店','grocery'],['マルエツ','grocery'],['明治屋','grocery'],['カルディ','grocery'],
['ツルハ','bulk'],['mancini','biz_lunch'],['赤坂biz','biz_lunch'],
['amazonプライム','prime'],['amazon prime','prime'],['spotify','spotify'],['bunpro','bunpro'],['claude','claude'],['anthropic','claude']
].map(a=>({p:a[0],c:a[1]}));

let S=fix(load()||{cats:DEFAULT_CATS,rules:DEFAULT_RULES,tx:[],budgets:{},income:{},shared:{},receipts:[],month:ym(new Date()),lastBackup:0});
let ui={tab:'ledger',scope:'my',q:'',open:null,collapsed:{},preview:null};
function load(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save. Storage may be full.')}schedSnap()}
const sdb=(typeof indexedDB==='undefined')?Promise.reject('none'):new Promise((res,rej)=>{const r=indexedDB.open('budgetLedgerSnaps',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
sdb.catch(()=>{});
const sreq=(mode,fn)=>sdb.then(d=>new Promise((res,rej)=>{const t=d.transaction('s',mode);const q=fn(t.objectStore('s'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
let snapT=0;
function schedSnap(){clearTimeout(snapT);snapT=setTimeout(()=>snapNow(''),1500)}
async function snapNow(label){
  try{
    if(!S.tx.length&&!S.sav.length&&!Object.keys(S.budgets).length&&!Object.keys(S.income).length)return;
    const now=Date.now(),k=label?'pre-'+now:today();
    await sreq('readwrite',st=>st.put({k:k,t:now,label:label,n:S.tx.length,state:JSON.stringify(S)}));
    await pruneSnaps();
  }catch(e){}
}
async function pruneSnaps(){
  const all=await sreq('readonly',st=>st.getAll());
  const daily=all.filter(x=>!x.label).sort((a,b)=>b.t-a.t),special=all.filter(x=>x.label).sort((a,b)=>b.t-a.t);
  const keep=new Set(daily.slice(0,30).map(x=>x.k));special.slice(0,5).forEach(x=>keep.add(x.k));
  const cutoff=Date.now()-366*864e5,seen=new Set();
  daily.slice(30).forEach(x=>{const m=x.k.slice(0,7);if(x.t>=cutoff&&!seen.has(m)){seen.add(m);keep.add(x.k)}});
  const drop=all.filter(x=>!keep.has(x.k));
  if(drop.length)await sreq('readwrite',st=>{drop.forEach(x=>st.delete(x.k))});
}
const armed={};
function arm(key,msg){const n=Date.now();if(armed[key]&&n-armed[key]<5000){delete armed[key];return true}armed[key]=n;toast(msg);return false}
function toast(t){const e=$('#toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

const idb=(typeof indexedDB==='undefined')?Promise.reject('none'):new Promise((res,rej)=>{const r=indexedDB.open('budgetLedgerPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
idb.catch(()=>{});
async function pPut(id,blob){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function pGet(id){const d=await idb;return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function pDel(id){try{const d=await idb;return new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=res})}catch(e){}}
const urlCache={};
async function hydrate(){const els=document.querySelectorAll('img[data-pid]');for(const el of els){const id=el.dataset.pid;try{if(!urlCache[id]){const b=await pGet(id);if(!b)continue;urlCache[id]=URL.createObjectURL(b)}el.src=urlCache[id]}catch(e){}}}
async function compress(file){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,sc=Math.min(1,1600/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.72));
}

const catById=id=>S.cats.find(c=>c.id===id);
const catName=id=>id?(catById(id)?catById(id).name:'Unknown'):'Needs a category';
function autoCat(merchant){const m=norm(merchant);if(!m)return '';const rs=[...S.rules].sort((a,b)=>b.p.length-a.p.length);for(const r of rs){if(m.includes(norm(r.p)))return r.c}return ''}
function ruleKey(merchant){const m=norm(merchant).replace(/[…\.]+$/,'');const w=m.split(/\s+/)[0];return w.length>=3?w:m}
function catOpts(sel,blank){
  let h=blank?'<option value="">Choose category…</option>':'';
  const gs={},solo=[];S.cats.forEach(c=>{if(c.g){(gs[c.g]=gs[c.g]||[]).push(c)}else solo.push(c)});
  for(const g in gs)h+='<optgroup label="'+esc(g)+'">'+gs[g].map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>';
  h+='<optgroup label="Other">'+solo.map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>';
  return h;
}

const DATE_RE=/(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/;
const HAS_TEXT=/[^\d,\s\-¥円.]/;
function parseAmt(tok){const t=String(tok).replace(/\u2212/g,'-').replace(/[¥円\s]/g,'');if(!/^-?[\d,]+$/.test(t)||!/\d/.test(t))return null;const n=parseInt(t.replace(/[^\d]/g,''),10);return isNaN(n)?null:n}
function csvSplit(s){const o=[];let cur='',q=false;for(const ch of s){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o.map(x=>x.trim()).filter(Boolean)}
function splitFields(s){
  if(s.includes('\t'))return s.split(/\t+/).map(x=>x.trim()).filter(Boolean);
  if(/^[^,]*,[^,]*,/.test(s)&&!/\s{2,}/.test(s))return csvSplit(s);
  return s.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);
}
const isNeg=t=>/^[-\u2212]/.test(String(t).replace(/[¥円\s]/g,''));
function parseStatement(text){
  const out=[];let pend=null;
  const push=(date,mer,amt,neg)=>{mer=String(mer).replace(/\s+/g,' ').trim();if(date&&mer&&amt>0)out.push({date:date,merchant:mer,amount:amt,neg:!!neg})};
  const tail=/^(.*?)\s+(-?[\d,\u2212]+)\s*円?$/;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.normalize('NFKC').trim();if(!line)continue;
    const dm=line.match(DATE_RE);
    if(dm){
      const date=dm[1]+'-'+pad(dm[2])+'-'+pad(dm[3]);
      const rest=(line.slice(0,dm.index)+line.slice(dm.index+dm[0].length)).trim();
      const toks=splitFields(rest);
      const mi=toks.findIndex(t=>HAS_TEXT.test(t));
      if(mi>=0){
        const mer=toks[mi];let amt=null,ng=false;
        for(let k=mi+1;k<toks.length;k++){const a=parseAmt(toks[k]);if(a!==null){amt=a;ng=isNeg(toks[k]);break}}
        if(amt!==null){push(date,mer,amt,ng);pend=null;continue}
        const tm=mer.match(tail);
        if(tm&&parseAmt(tm[2])!==null&&HAS_TEXT.test(tm[1])){push(date,tm[1],parseAmt(tm[2]),isNeg(tm[2]));pend=null;continue}
        pend={date:date,merchant:mer};continue;
      }
      pend={date:date};continue;
    }
    if(pend){
      if(!pend.merchant){
        const tm=line.match(tail);
        if(tm&&parseAmt(tm[2])!==null&&HAS_TEXT.test(tm[1])){push(pend.date,tm[1],parseAmt(tm[2]),isNeg(tm[2]));pend=null;continue}
        if(HAS_TEXT.test(line)){pend.merchant=line;continue}
      }else{
        const a=parseAmt(line);if(a!==null){push(pend.date,pend.merchant,a,isNeg(line));pend=null;continue}
      }
    }
  }
  return out;
}

function eff(map,m){if(!map)return undefined;const ks=Object.keys(map).filter(k=>k<=m).sort();return ks.length?map[ks[ks.length-1]]:undefined}
const monthTx=(m,sc)=>S.tx.filter(t=>t.date.startsWith(m)&&(sc==='shared'?t.from==='shared':t.from!=='shared'));
function actualBy(m,sc){const a={};monthTx(m,sc).forEach(t=>{const k=t.cat||'_none';a[k]=(a[k]||0)+t.amount});return a}
function structure(){const out=[],seen={};S.cats.forEach(c=>{if(!c.g)out.push({leaf:c});else{if(!seen[c.g]){seen[c.g]={name:c.g,cats:[]};out.push(seen[c.g])}seen[c.g].cats.push(c)}});return out}
const sum=a=>a.reduce((x,y)=>x+y,0);
function fix(s){
  if(!s.buckets)s.buckets=[1,2,3,4,5].map(i=>({id:'b'+i,name:'Bucket '+i}));
  if(!s.sav)s.sav=[];
  if(!s.recur)s.recur=[];
  if(!s.recurDone)s.recurDone={};
  if(!s.rate)s.rate=0;
  if(!s.rates)s.rates={};
  return s;
}
const rateTried={};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
async function fetchRates(from,to){
  if(typeof fetch==='undefined')return false;
  const lim=today();if(from>lim)from=lim;if(to&&to>lim)to=lim;
  const hosts=['https://api.frankfurter.dev/v1/','https://api.frankfurter.app/'];
  for(const h of hosts){
    try{
      const range=!!(to&&to!==from);
      const start=range?isoOf(new Date(new Date(from+'T12:00:00').getTime()-4*864e5)):from;
      const r=await fetch(h+start+(range?'..'+to:'')+'?base=USD&symbols=JPY');
      if(!r.ok)continue;
      const j=await r.json();if(!j||!j.rates)continue;
      if(typeof j.rates.JPY==='number'){S.rates[from]=j.rates.JPY;if(j.date)S.rates[j.date]=j.rates.JPY}
      else{
        let last=null;const end=new Date((to||from)+'T12:00:00').getTime();
        for(let t=new Date(start+'T12:00:00').getTime();t<=end;t+=864e5){
          const d=isoOf(new Date(t)),v=j.rates[d];
          if(v&&typeof v.JPY==='number')last=v.JPY;
          if(last!==null)S.rates[d]=last;
        }
      }
      persist();return true;
    }catch(e){}
  }
  return false;
}
function dayRate(d){const k=d>today()?today():d;return S.rates[k]||0}
function usdSpent(m){
  let usd=0,miss=0;
  monthTx(m,'my').forEach(t=>{if(t.cur==='USD'){usd+=t.orig;return}const r=dayRate(t.date);if(r)usd+=t.amount/r;else miss++});
  return{usd:usd,miss:miss};
}
const usdFmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
function usdLine(m){
  const u=usdSpent(m);if(!u.usd&&!u.miss)return '';
  return '<p class="mut" style="margin:0 0 10px">About '+usdFmt(u.usd)+' spent this month, converted at each day\'s rate.'+(u.miss?' '+u.miss+' transaction'+(u.miss>1?'s are':' is')+' waiting for a rate.':'')+'</p>';
}
async function ensureAllRates(){
  const by={};S.tx.forEach(t=>{if(t.cur!=='USD'&&!dayRate(t.date)){(by[t.date.slice(0,7)]=by[t.date.slice(0,7)]||[]).push(t.date)}});
  const ms=Object.keys(by).sort();if(!ms.length)return;
  toast('Looking up exchange rates…');
  for(const m of ms){const ds=by[m].sort();await fetchRates(ds[0],ds[ds.length-1])}
}
async function ensureRates(m){
  if(rateTried[m])return;
  const dates=[...new Set(monthTx(m,'my').map(t=>t.date))].filter(d=>!dayRate(d)).sort();
  if(!dates.length)return;
  rateTried[m]=1;
  const ok=await fetchRates(dates[0],dates[dates.length-1]);
  if(ok&&(ui.tab==='month'||ui.tab==='ledger'))render();
}
const num=t=>{const n=parseFloat(String(t==null?'':t).replace(/[^\d.]/g,''));return isNaN(n)?0:n};
const dim=m=>{const p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate()};
function isDup(r){
  const nm=norm(r.merchant);
  if(S.tx.some(t=>t.date===r.date&&t.amount===r.amount&&norm(t.merchant)===nm))return true;
  const g={};S.tx.forEach(t=>{if(t.grp&&t.date===r.date&&norm(t.merchant)===nm)g[t.grp]=(g[t.grp]||0)+t.amount});
  return Object.values(g).some(v=>v===r.amount);
}
const bName=id=>{const b=S.buckets.find(x=>x.id===id);return b?b.name:'Deleted bucket'};
const bBal=id=>sum(S.sav.filter(e=>e.bucket===id).map(e=>e.amount));
function savMonth(m){const l=S.sav.filter(e=>!e.xfer&&e.date.startsWith(m));return{dep:sum(l.filter(e=>e.amount>0).map(e=>e.amount)),wd:-sum(l.filter(e=>e.amount<0).map(e=>e.amount))}}
function monthStats(m){
  const act=actualBy(m,'my'),inc=S.income[m]||0;
  const rows=S.cats.map(c=>({c:c,b:eff(S.budgets[c.id],m)||0,a:act[c.id]||0}));
  const none=act._none||0;
  let totB=0,totA=0,miss=0;rows.forEach(r=>{totB+=r.b;totA+=r.a;miss+=Math.abs(r.b-r.a)});
  totA+=none;miss+=none;
  const sv=savMonth(m);
  return{inc:inc,rows:rows,none:none,totB:totB,totA:totA,miss:miss,acc:totB>0?Math.max(0,Math.round((1-miss/totB)*100)):null,dep:sv.dep,wd:sv.wd,left:inc-totA-sv.dep+sv.wd};
}

function candidates(r){
  const taken=new Set(S.receipts.filter(x=>x.txId).map(x=>x.txId));
  return S.tx.filter(t=>!taken.has(t.id)&&dayDiff(t.date,r.date)<=3).sort((a,b)=>{
    const ea=(r.amount&&a.amount===r.amount)?0:1,eb=(r.amount&&b.amount===r.amount)?0:1;
    return ea-eb||dayDiff(a.date,r.date)-dayDiff(b.date,r.date)});
}
function autoMatch(){let n=0;for(const r of S.receipts){if(r.txId||!r.amount)continue;const c=candidates(r).find(t=>t.amount===r.amount);if(c){r.txId=c.id;n++}}save();return n}

function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}

function header(){

  const showM=['ledger','month','trends','savings'].includes(ui.tab);
  return '<header><h1>'+titles[ui.tab]+'</h1>'+(showM?'<div class="mn"><button aria-label="Previous month" onclick="A.month(-1)">‹</button><b>'+monthLabel(S.month)+'</b><button aria-label="Next month" onclick="A.month(1)">›</button></div>':'')+'</header>';

function recFor(id){return S.receipts.filter(r=>r.txId===id)}
function viewLedger(){
  const m=S.month;let list=S.tx.filter(t=>t.date.startsWith(m));
  const need=list.filter(t=>!t.cat).length;
  const q=norm(ui.q);if(q)list=list.filter(t=>norm(t.merchant).includes(q)||norm(catName(t.cat)).includes(q));
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const days=S.lastBackup?(Date.now()-S.lastBackup)/864e5:999;
  let h='';
  if(S.tx.length&&days>7)h+='<div class="banner">No backup file saved in the last 7 days. Open Settings and export one.</div>';
  if(need)h+='<div class="banner">'+need+' transaction'+(need>1?'s':'')+' need a category. Tap them to set one.</div>';
  h+=dueCard();
  h+='<div class="row" style="margin:0 0 12px"><input class="grow" placeholder="Search merchant or category" value="'+esc(ui.q)+'" onchange="A.q(this.value)"><button onclick="A.openImport()">Import</button></div>';
  if(!list.length)return h+'<div class="empty">No transactions in '+monthLabel(m)+'.<br>Tap + to add one, or Import to paste a statement.</div>';
  const tot=sum(list.filter(t=>t.from!=='shared').map(t=>t.amount));
  h+='<p class="mut" style="margin:0 0 8px">'+list.length+' transactions · '+yen(tot)+' from your own spending'+(usdSpent(m).usd?' · about '+usdFmt(usdSpent(m).usd):'')+'</p><div class="card">';
  list.forEach(t=>{
    const rc=recFor(t.id).length;
    h+='<div class="tx" onclick="A.editTx(\''+t.id+'\')"><div class="grow"><div class="m">'+esc(t.merchant)+'</div><div class="mut">'+t.date.slice(5).replace('-','/')+' · <span class="chip'+(t.cat?'':' w')+'">'+esc(catName(t.cat))+'</span>'+(t.from==='shared'?'<span class="chip o">Shared</span>':'')+(t.grp?'<span class="chip">Split</span>':'')+(t.cur==='USD'?'<span class="chip">$'+t.orig+'</span>':'')+(rc?'<span class="chip">Receipt</span>':'')+'</div></div><div style="white-space:nowrap">'+yen(t.amount)+'</div></div>';
  });
  return h+'</div>';
}

  '<label>Currency</label><select id="f_cur" onchange="A.curChg()"><option value="JPY">Yen (¥)</option><option value="USD"'+(usd?' selected':'')+'>US dollars ($)</option></select>'+

  '<div class="row" style="margin-top:14px"><button class="pri grow" onclick="A.saveTx(\''+(id||'')+'\')">Save</button>'+(id?'<button onclick="A.split(\''+id+'\')">'+(t.grp?'Edit split':'Split')+'</button><button class="dng" onclick="A.delTx(\''+id+'\')">Delete</button>':'')+'<button onclick="closeModal()">Cancel</button></div>');

A.curChg=()=>{const u=$('#f_cur').value==='USD';$('#f_rb').hidden=!u;$('#f_al').textContent=(u?'Amount (US dollars)':'Amount (yen)')+' · use a minus sign for a refund';if(u&&!$('#f_rate').value&&S.rate)$('#f_rate').value=S.rate;A.conv();if(u)A.rateLookup()};
A.rateLookup=async()=>{
  const cs=$('#f_cur');if(!cs||cs.value!=='USD')return;
  const d=$('#f_date').value;if(!d)return;
  const box=$('#f_rs');let r=dayRate(d);
  if(!r){if(box)box.textContent='Looking up the rate for '+d+'…';await fetchRates(d);r=dayRate(d)}
  const inp=$('#f_rate'),box2=$('#f_rs');if(!inp||!box2)return;
  if(r){if(!inp.dataset.t)inp.value=r;box2.textContent='Rate for '+d.slice(5).replace('-','/')+': ¥'+r.toFixed(2)+' per $1 (European Central Bank). You can change it.'}
  else box2.textContent='Could not look up the rate. Check your connection, or type a rate yourself.';
  A.conv();
};
A.conv=()=>{const e=$('#f_cv');if(!e||$('#f_cur').value!=='USD')return;const a=Math.abs(num($('#f_amt').value)),r=num($('#f_rate').value);e.textContent=(a&&r)?'Counts as '+yen(Math.round(a*r))+' in your budget.':'Enter the exchange rate to see the yen amount.'};
A.suggest=()=>{
  const v=$('#f_mer').value,n=norm(v);if(!n)return;
  const last=S.tx.filter(t=>norm(t.merchant)===n).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const sel=$('#f_cat');if(!sel.value){const c=autoCat(v)||(last&&last.cat);if(c)sel.value=c}
  if(last&&!$('#f_amt').value){
    $('#f_from').value=last.from==='shared'?'shared':'mine';
    if(last.cur==='USD'){$('#f_cur').value='USD';A.curChg();$('#f_amt').value=last.orig;$('#f_rate').value=last.rate;A.conv();A.rateLookup()}
    else $('#f_amt').value=last.amount;
  }
};
A.saveTx=id=>{
  const date=$('#f_date').value,mer=$('#f_mer').value.trim(),cat=$('#f_cat').value,from=$('#f_from').value,cur=$('#f_cur').value;
  let amt,extra;
  if(cur==='USD'){
    const sg=/^\s*[-\u2212]/.test($('#f_amt').value)?-1:1,usd=sg*num($('#f_amt').value),rate=num($('#f_rate').value);
    if(!date||!mer||!usd||!rate){toast('Enter a date, merchant, dollar amount and exchange rate.');return}
    amt=Math.round(usd*rate);extra={cur:'USD',orig:usd,rate:rate};S.rate=rate;
  }else{
    amt=parseAmt($('#f_amt').value);if(amt&&/^\s*[-\u2212]/.test($('#f_amt').value))amt=-Math.abs(amt);extra={cur:'',orig:0,rate:0};
    if(!date||!mer||!amt){toast('Enter a date, merchant, and amount.');return}
  }
  if(id){const t=S.tx.find(x=>x.id===id);Object.assign(t,{date:date,merchant:mer,amount:amt,cat:cat,from:from},extra)}
  else S.tx.push(Object.assign({id:uid(),date:date,merchant:mer,amount:amt,cat:cat,from:from},extra));
  if(cat&&$('#f_rem').checked&&!autoCat(mer))S.rules.push({p:ruleKey(mer),c:cat});
  save();closeModal();render();
};
A.delTx=id=>{if(!arm('d'+id,'Tap Delete again to confirm.'))return;S.tx=S.tx.filter(t=>t.id!==id);S.receipts.forEach(r=>{if(r.txId===id)r.txId=''});save();closeModal();render()};

A.openImport=()=>modal('<h3>Import transactions</h3><p class="mut">Paste statement text, or choose a CSV or text file. Dates need a four-digit year, such as 2026/05/15.</p>'+
  '<textarea id="imp" rows="8" placeholder="Paste here"></textarea>'+

A.readFile=async inp=>{
  const f=inp.files[0];if(!f)return;const buf=await f.arrayBuffer();let txt;
  try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{txt=new TextDecoder('shift_jis').decode(buf)}catch(e2){txt=''}}
  $('#imp').value=txt;
};
A.previewImport=()=>{
  const rows=parseStatement($('#imp').value),from=$('#imp_from').value;
  if(!rows.length){toast('No transactions found. Check that each line has a date, merchant, and amount.');return}
  const nn=rows.filter(r=>r.neg).length;
  if(nn>rows.length/2){rows.forEach(r=>{if(!r.neg){r.credit=true;r.amount=-r.amount}})}
  else{rows.forEach(r=>{if(r.neg){r.refund=true;r.amount=-r.amount}})}
  rows.forEach(r=>{r.cat=autoCat(r.merchant);r.dup=isDup(r);r.inc=!r.dup&&!r.credit});
  ui.preview={rows:rows,from:from};showPreview();
};
function showPreview(){

  '<label><input type="checkbox" id="pv_rem" checked style="width:auto"> Remember merchants I categorize</label>'+
  '<div class="row" style="margin-top:14px"><button class="pri grow" onclick="A.commitImport()">Add '+n+' transactions</button><button onclick="closeModal()">Cancel</button></div>');
}
A.pvChk=(i,v)=>{ui.preview.rows[i].inc=v;const y=$('.sheet .pri');if(y)y.textContent='Add '+ui.preview.rows.filter(r=>r.inc).length+' transactions'};
A.pvCat=(i,v)=>{ui.preview.rows[i].cat=v};
A.commitImport=()=>{
  const p=ui.preview,rem=$('#pv_rem').checked;let n=0;

  const first=p.rows.filter(r=>r.inc).map(r=>r.date.slice(0,7)).sort()[0];if(first)S.month=first;
  const mt=autoMatch();save();closeModal();render();

function viewMonth(){
  const m=S.month,sc=ui.scope,act=actualBy(m,sc);
  const seg='<div class="seg"><button class="'+(sc==='my'?'on':'')+'" onclick="A.scope(\'my\')">My spending</button><button class="'+(sc==='shared'?'on':'')+'" onclick="A.scope(\'shared\')">Shared account</button></div>';
  if(sc==='shared'){
    const spent=sum(Object.values(act)),inn=eff(S.shared,m)||0;
    let h=seg+'<div class="met"><div><small>Contributions in</small><input inputmode="numeric" value="'+fmtN(inn)+'" placeholder="0" onchange="A.setShared(this.value)"></div><div><small>Spent</small><b>'+yen(spent)+'</b></div><div><small>Balance</small><b class="'+(inn-spent<0?'wn':'')+'">'+yen(inn-spent)+'</b></div></div>';
    const rows=S.cats.filter(c=>act[c.id]).map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+yen(act[c.id])+'</td></tr>').join('')+(act._none?'<tr><td class="wn">Needs a category</td><td>'+yen(act._none)+'</td></tr>':'');
    return h+(rows?'<div class="card"><table><thead><tr><th>Category</th><th>Actual</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No shared-account spending in '+monthLabel(m)+'. Mark a transaction as paid from the shared account to see it here.</div>');
  }
  const st=monthStats(m),inc=st.inc,totA=st.totA;
  const bOf=c=>eff(S.budgets[c.id],m)||0;
  const accTxt=st.acc===null?'–':st.acc+'%';
  let h=seg+'<div class="met"><div><small>Income (tap to edit)</small><input inputmode="numeric" value="'+fmtN(inc)+'" placeholder="0" onchange="A.setIncome(this.value)"></div><div><small>Spent</small><b>'+yen(totA)+'</b></div><div><small>Left to allocate</small><b class="'+(st.left<0?'wn':'')+'">'+yen(st.left)+'</b></div><div><small>Budget accuracy</small><b>'+accTxt+'</b></div><div><small>Saved this month</small><b>'+yen(st.dep-st.wd)+'</b></div><div><small>All savings</small><b>'+yen(sum(S.buckets.map(b=>bBal(b.id))))+'</b></div></div>'+usdLine(m)+incHint(m,inc)+'<div class="row" style="margin:0 0 12px"><button class="grow" onclick="A.summary()">Month summary</button><button class="grow" onclick="A.allocate()">Allocate savings</button></div>';
  const line=(c,ind)=>{
    const b=bOf(c),a=act[c.id]||0,left=b-a,pct=b>0?Math.max(0,Math.min(100,a/b*100)):(a>0?100:0);
    let r='<tr><td class="'+(ind?'ind':'')+'" onclick="A.editCat(\''+c.id+'\')" style="cursor:pointer">'+esc(c.name)+'</td><td><input inputmode="numeric" value="'+fmtN(b)+'" placeholder="0" onchange="A.setBudget(\''+c.id+'\',this.value)"></td><td onclick="A.openCat(\''+c.id+'\')" style="cursor:pointer;text-decoration:underline dotted">'+(a?yen(a):'–')+'</td><td class="'+(left<0?'wn':'')+'">'+((b||a)?yen(left):'')+'</td><td><div class="bar"><i style="width:'+pct+'%;background:var(--'+(a>b?'warn':'ok')+')"></i></div></td></tr>';
    if(ui.open===c.id)r+='<tr><td colspan="5" style="padding:0">'+monthTx(m,sc).filter(t=>t.cat===c.id).sort((x,y)=>y.date.localeCompare(x.date)).map(t=>'<div class="sub" onclick="A.editTx(\''+t.id+'\')"><span>'+t.date.slice(5).replace('-','/')+' '+esc(t.merchant)+'</span><span>'+yen(t.amount)+'</span></div>').join('')+'</td></tr>';
    return r;
  };
  let body='';
  structure().forEach((s,si)=>{
    if(s.leaf){body+=line(s.leaf,false);return}
    const gb=sum(s.cats.map(bOf)),ga=sum(s.cats.map(c=>act[c.id]||0)),col=ui.collapsed[s.name];
    body+='<tr class="g" onclick="A.toggleGroup(\''+jq(s.name)+'\')"><td>'+(col?'▸ ':'▾ ')+esc(s.name)+' <span onclick="event.stopPropagation();A.editGroup('+si+')" style="padding:4px 8px" aria-label="Edit group">✎</span></td><td>'+(gb?yen(gb):'–')+'</td><td>'+(ga?yen(ga):'–')+'</td><td class="'+(gb-ga<0?'wn':'')+'">'+((gb||ga)?yen(gb-ga):'')+'</td><td></td></tr>';
    if(!col)s.cats.forEach(c=>body+=line(c,true));
  });
  if(act._none)body+='<tr><td class="wn">Needs a category</td><td></td><td>'+yen(act._none)+'</td><td></td><td></td></tr>';

function viewTrends(){
  const first=S.tx.map(t=>t.date.slice(0,7)).sort()[0];
  if(!first)return '<div class="empty">Trends appear once you have transactions.</div>';
  let months=[];for(let i=5;i>=0;i--)months.push(addMonths(S.month,-i));
  months=months.filter(x=>x>=first);if(!months.length)months=[S.month];
  const data={};S.cats.forEach(c=>{data[c.id]=months.map(m=>sum(S.tx.filter(t=>t.cat===c.id&&t.from!=='shared'&&t.date.startsWith(m)).map(t=>t.amount)))});
  const fmt=v=>v?(v>=100000?Math.round(v/1000):(Math.round(v/100)/10)):'–';
  const cell=(v,avg)=>{let bg='';if(months.length>=3&&avg>0){if(v>avg*1.1)bg='background:var(--warnbg)';else if(v<avg*.9)bg='background:var(--okbg)'}return '<td style="'+bg+'">'+fmt(v)+'</td>'};
  const trend=arr=>{if(months.length<3)return '–';const last=arr.slice(-2),prior=arr.slice(0,-2);const l=sum(last)/last.length,p=sum(prior)/prior.length;if(!p&&!l)return '–';if(l>p*1.1)return '<span class="wn">↗ Up</span>';if(l<p*.9)return '<span class="ok">↘ Down</span>';return '→ Flat'};
  const rowOf=(name,arr,ind,g)=>{const avg=sum(arr)/arr.length;return '<tr'+(g?' class="g" style="cursor:default"':'')+'><td class="'+(ind?'ind':'')+'">'+esc(name)+'</td>'+arr.map(v=>cell(v,avg)).join('')+'<td>'+fmt(avg)+'</td><td>'+trend(arr)+'</td></tr>'};
  let body='';
  structure().forEach(s=>{
    if(s.leaf){const a=data[s.leaf.id];if(sum(a))body+=rowOf(s.leaf.name,a,false,false);return}
    const kids=s.cats.filter(c=>sum(data[c.id]));if(!kids.length)return;
    body+=rowOf(s.name,months.map((_,i)=>sum(s.cats.map(c=>data[c.id][i]))),false,true);
    kids.forEach(c=>body+=rowOf(c.name,data[c.id],true,false));
  });
  if(!body)return '<div class="empty">No spending in this window yet.</div>';
  const none=months.map(m=>sum(S.tx.filter(t=>!t.cat&&t.from!=='shared'&&t.date.startsWith(m)).map(t=>t.amount)));
  const tot=months.map((m,i)=>sum(S.cats.map(c=>data[c.id][i]))+none[i]);
  return '<p class="mut">Your spending in thousands of yen. Shading marks months more than 10% above or below that row’s average.</p><div class="card" style="overflow-x:auto"><table><thead><tr><th>Category</th>'+months.map(m=>'<th>'+MN[+m.slice(5)-1]+'</th>').join('')+'<th>Avg</th><th>Trend</th></tr></thead><tbody>'+body+rowOf('Total',tot,false,true)+'</tbody></table></div>';
}

    for(const k of await caches.keys())await caches.delete(k);
    location.reload();
  }catch(e){toast('Could not reach the server. You need a connection to update.')}
};
A.snaps=async()=>{
  const box=$('#snaplist');if(!box)return;
  try{
    const all=(await sreq('readonly',st=>st.getAll())).sort((a,b)=>b.t-a.t);
    if(!all.length){box.innerHTML='<p class="mut">No versions yet. The first one is saved shortly after your next change.</p>';return}
    box.innerHTML='<div class="card">'+all.map(x=>'<div class="tx" style="cursor:default"><div class="grow"><div class="m">'+(x.label?esc(x.label):'Daily copy')+'</div><div class="mut">'+new Date(x.t).toLocaleString()+' · '+x.n+' transactions</div></div><button onclick="A.restoreSnap(\''+x.k+'\')">Restore</button></div>').join('')+'</div>';
  }catch(e){box.innerHTML='<p class="mut">Version history is not available in this browser.</p>'}
};
A.restoreSnap=async k=>{
  try{
    const x=await sreq('readonly',st=>st.get(k));if(!x)return;
    if(!arm('s'+k,'Tap Restore again to confirm. Your current data is saved first.'))return;
    await snapNow('Before restore');
    const lb=S.lastBackup;S=fix(JSON.parse(x.state));S.lastBackup=lb;
    save();render();toast('Version restored');
  }catch(e){toast('Could not restore that version.')}
};
A.reset=async()=>{
  if(!arm('reset','Tap Erase again to confirm. Your numbers stay in version history.'))return;
  await snapNow('Before erase');
  localStorage.removeItem(LS);S.receipts.forEach(r=>pDel(r.id));location.reload();
};

// ---------- Split purchases ----------
A.split=id=>{
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  let parts,ids;
  if(t.grp){const g=S.tx.filter(x=>x.grp===t.grp);ids=g.map(x=>x.id);parts=g.map(x=>({cat:x.cat,amt:x.amount}))}
  else{ids=[t.id];const h=Math.floor(t.amount/2);parts=[{cat:t.cat,amt:h},{cat:'',amt:t.amount-h}]}
  ui.split={ids:ids,date:t.date,merchant:t.merchant,from:t.from,total:sum(parts.map(p=>p.amt)),parts:parts};
  A.spDraw();
};
A.spDraw=()=>{
  const s=ui.split;
  modal('<h3>Split purchase</h3><p class="mut">'+esc(s.merchant)+' · '+s.date.slice(5).replace('-','/')+' · total '+yen(s.total)+'</p><div class="card">'+s.parts.map((p,i)=>'<div class="tx" style="cursor:default;gap:8px"><select class="grow" onchange="A.spCat('+i+',this.value)">'+catOpts(p.cat,true)+'</select><input style="width:96px" inputmode="numeric" value="'+(p.amt||'')+'" oninput="A.spAmt('+i+',this.value)" aria-label="Amount">'+(s.parts.length>2?'<button class="dng" onclick="A.spDel('+i+')" aria-label="Remove part">×</button>':'')+'</div>').join('')+'</div><p id="sp_rem" class="mut"></p><div class="row"><button onclick="A.spAdd()">Add a part</button>'+(s.ids.length>1?'<button onclick="A.spMerge()">Merge back into one</button>':'')+'</div><div class="row" style="margin-top:14px"><button class="pri grow" onclick="A.spSave()">Save split</button><button onclick="closeModal()">Cancel</button></div>');
  A.spRem();
};
A.spRem=()=>{const s=ui.split,rem=s.total-sum(s.parts.map(p=>p.amt||0)),e=$('#sp_rem');if(!e)return;e.textContent=rem===0?'The parts add up to the total.':(rem>0?yen(rem)+' still to assign.':yen(-rem)+' over the total.');e.className=rem===0?'mut':'wn'};
A.spCat=(i,v)=>{ui.split.parts[i].cat=v};
A.spAmt=(i,v)=>{ui.split.parts[i].amt=parseAmt(v)||0;A.spRem()};
A.spAdd=()=>{ui.split.parts.push({cat:'',amt:Math.max(0,ui.split.total-sum(ui.split.parts.map(p=>p.amt||0)))});A.spDraw()};
A.spDel=i=>{ui.split.parts.splice(i,1);A.spDraw()};
A.spSave=()=>{
  const s=ui.split;
  if(s.parts.some(p=>!p.amt)){toast('Every part needs an amount.');return}
  if(sum(s.parts.map(p=>p.amt))!==s.total){toast('The parts must add up to '+yen(s.total)+'.');return}
  const g=uid(),ids=new Set(s.ids),nid=s.parts.map(()=>uid());
  S.tx=S.tx.filter(x=>!ids.has(x.id));
  s.parts.forEach((p,i)=>S.tx.push({id:nid[i],date:s.date,merchant:s.merchant,amount:p.amt,cat:p.cat,from:s.from,grp:g}));
  S.receipts.forEach(r=>{if(ids.has(r.txId))r.txId=nid[0]});
  save();closeModal();render();toast('Split saved');
};
A.spMerge=()=>{
  const s=ui.split,ids=new Set(s.ids),nid=uid();
  S.tx=S.tx.filter(x=>!ids.has(x.id));
  S.tx.push({id:nid,date:s.date,merchant:s.merchant,amount:s.total,cat:'',from:s.from});
  S.receipts.forEach(r=>{if(ids.has(r.txId))r.txId=nid});
  save();closeModal();render();toast('Merged. Choose a category for it.');
};

// ---------- Recurring entries ----------
function dueList(){if(S.month>ym(new Date()))return[];return S.recur.filter(r=>r.start<=S.month&&!S.recurDone[r.id+'|'+S.month])}
function dueCard(){
  const d=dueList();if(!d.length)return '';
  return '<h3 style="font-weight:500;margin:0 0 6px">Due this month</h3><div class="card">'+d.map(r=>{
    const usd=r.cur==='USD';
    return '<div class="tx" style="cursor:default;flex-direction:column;gap:8px"><div class="row"><div class="grow m">'+esc(r.name)+'</div><span class="mut">'+esc(catName(r.cat))+' · day '+r.day+'</span></div><div class="row"><input style="width:110px" id="rc_a_'+r.id+'" inputmode="decimal" value="'+r.amount+'" aria-label="Amount">'+(usd?'<input style="width:90px" id="rc_r_'+r.id+'" inputmode="decimal" placeholder="Rate" value="'+(S.rate||'')+'" oninput="this.dataset.t=1" aria-label="Exchange rate">':'')+'<span class="mut">'+(usd?'$ and rate':'yen')+'</span><span class="grow"></span><button class="pri" onclick="A.recAdd(\''+r.id+'\')">Add</button><button onclick="A.recSkip(\''+r.id+'\')">Skip</button></div></div>';
  }).join('')+'</div>';
}
A.recAdd=id=>{
  const r=S.recur.find(x=>x.id===id);if(!r)return;
  const a=num($('#rc_a_'+id).value);if(!a){toast('Enter an amount.');return}
  const tx={id:uid(),date:S.month+'-'+pad(Math.min(r.day,dim(S.month))),merchant:r.name,amount:Math.round(a),cat:r.cat,from:r.from};
  if(r.cur==='USD'){const rate=num($('#rc_r_'+id).value);if(!rate){toast('Enter the exchange rate.');return}tx.amount=Math.round(a*rate);tx.cur='USD';tx.orig=a;tx.rate=rate;S.rate=rate}
  S.tx.push(tx);S.recurDone[id+'|'+S.month]=tx.id;save();render();toast('Added '+r.name);
};
A.dueRates=()=>{
  dueList().filter(r=>r.cur==='USD').forEach(async r=>{
    let d=S.month+'-'+pad(Math.min(r.day,dim(S.month)));if(d>today())d=today();
    let v=dayRate(d);
    if(!v&&!rateTried['d'+d]){rateTried['d'+d]=1;await fetchRates(d);v=dayRate(d)}
    const inp=$('#rc_r_'+r.id);if(v&&inp&&!inp.dataset.t)inp.value=v;
  });
};
A.recSkip=id=>{S.recurDone[id+'|'+S.month]='skip';save();render()};
function recurSection(){
  let h='<h3 style="font-weight:500;margin:22px 0 6px">Recurring entries</h3><p class="mut">Set up rent, subscriptions and anything else that repeats. Each month they appear at the top of the Ledger, and you confirm them with one tap.</p>';
  if(S.recur.length)h+='<div class="card">'+S.recur.map(r=>'<div class="tx" onclick="A.editRecur(\''+r.id+'\')"><div class="grow"><div class="m">'+esc(r.name)+'</div><div class="mut">'+esc(catName(r.cat))+' · day '+r.day+'</div></div><div>'+(r.cur==='USD'?'$'+r.amount:yen(r.amount))+'</div></div>').join('')+'</div>';
  return h+'<div class="row"><button onclick="A.editRecur(\'\')">Add a recurring entry</button></div>';
}
A.editRecur=id=>{
  const r=id?S.recur.find(x=>x.id===id):{name:'',amount:'',cat:'',from:'mine',day:1,cur:''};if(!r)return;
  modal('<h3>'+(id?'Edit recurring entry':'Add a recurring entry')+'</h3><label>Name</label><input id="rr_n" value="'+esc(r.name)+'" placeholder="Rent"><label>Amount</label><input id="rr_a" inputmode="decimal" value="'+(r.amount||'')+'"><label>Currency</label><select id="rr_c"><option value="JPY">Yen (¥)</option><option value="USD"'+(r.cur==='USD'?' selected':'')+'>US dollars ($)</option></select><label>Category</label><select id="rr_cat">'+catOpts(r.cat,true)+'</select><label>Paid from</label><select id="rr_f"><option value="mine"'+(r.from!=='shared'?' selected':'')+'>My card or cash</option><option value="shared"'+(r.from==='shared'?' selected':'')+'>Shared account</option></select><label>Day of the month</label><input id="rr_d" inputmode="numeric" value="'+r.day+'"><div class="row" style="margin-top:14px"><button class="pri grow" onclick="A.saveRecur(\''+(id||'')+'\')">Save</button>'+(id?'<button class="dng" onclick="A.delRecur(\''+id+'\')">Delete</button>':'')+'<button onclick="closeModal()">Cancel</button></div>');
};
A.saveRecur=id=>{
  const name=$('#rr_n').value.trim(),amount=num($('#rr_a').value),day=Math.min(31,Math.max(1,parseInt($('#rr_d').value,10)||1));
  if(!name||!amount){toast('Enter a name and an amount.');return}
  const v={name:name,amount:amount,cur:$('#rr_c').value==='USD'?'USD':'',cat:$('#rr_cat').value,from:$('#rr_f').value,day:day};
  if(id)Object.assign(S.recur.find(x=>x.id===id),v);else S.recur.push(Object.assign({id:'r_'+uid(),start:ym(new Date())},v));
  save();closeModal();render();toast('Saved');
};
A.delRecur=id=>{if(!arm('rr'+id,'Tap Delete again to confirm.'))return;S.recur=S.recur.filter(x=>x.id!==id);save();closeModal();render()};

// ---------- Savings ----------
const bOpts=sel=>S.buckets.map(b=>'<option value="'+b.id+'"'+(b.id===sel?' selected':'')+'>'+esc(b.name)+'</option>').join('');
function viewSavings(){
  const total=sum(S.buckets.map(b=>bBal(b.id))),sv=savMonth(S.month);
  let h='<div class="met"><div><small>Total saved</small><b>'+yen(total)+'</b></div><div><small>Net this month</small><b>'+yen(sv.dep-sv.wd)+'</b></div></div>';
  h+='<div class="card">'+(S.buckets.length?S.buckets.map(b=>'<div class="tx" onclick="A.editBucket(\''+b.id+'\')"><div class="grow m">'+esc(b.name)+'</div><div>'+yen(bBal(b.id))+'</div></div>').join(''):'<div class="empty">No buckets yet.</div>')+'</div><div class="row" style="margin:0 0 14px"><button onclick="A.newBucket()">Add a bucket</button></div>';
  const list=S.sav.filter(e=>e.date.startsWith(S.month)).sort((a,b)=>b.date.localeCompare(a.date));
  h+='<h3 style="font-weight:500;margin:0 0 6px">Entries in '+monthLabel(S.month)+'</h3>';
  if(!list.length)return h+'<div class="empty">No savings entries this month.<br>Tap + to add a deposit, a withdrawal or a move, or use Allocate savings on the Month tab.</div>';
  return h+'<div class="card">'+list.map(e=>'<div class="tx" onclick="A.savEntry(\''+e.id+'\')"><div class="grow"><div class="m">'+esc(e.note||(e.xfer?'Move':e.amount>0?'Deposit':'Withdrawal'))+'</div><div class="mut">'+e.date.slice(5).replace('-','/')+' · <span class="chip">'+esc(bName(e.bucket))+'</span>'+(e.xfer?'<span class="chip o">Move</span>':'')+'</div></div><div class="'+(e.amount>0?'ok':'wn')+'" style="white-space:nowrap">'+(e.amount>0?'+':'')+yen(e.amount)+'</div></div>').join('')+'</div>';
}
A.newBucket=()=>modal('<h3>Add a bucket</h3><label>Name</label><input id="bk_n" placeholder="Name"><div class="row" style="margin-top:12px"><button class="pri grow" onclick="A.addBucket()">Add</button><button onclick="closeModal()">Cancel</button></div>');
A.addBucket=()=>{const n=$('#bk_n').value.trim();if(!n){toast('Enter a name.');return}S.buckets.push({id:'b_'+uid(),name:n});save();closeModal();render()};
A.editBucket=id=>{
  const b=S.buckets.find(x=>x.id===id);if(!b)return;const n=S.sav.filter(e=>e.bucket===id).length;
  modal('<h3>Edit bucket</h3><label>Name</label><input id="bk_n" value="'+esc(b.name)+'"><p class="mut">Balance '+yen(bBal(id))+'</p><div class="row"><button class="pri grow" onclick="A.saveBucket(\''+id+'\')">Save</button><button class="dng" onclick="A.delBucket(\''+id+'\')">Delete</button><button onclick="closeModal()">Close</button></div><p class="mut">Deleting a bucket also deletes its '+n+' entr'+(n===1?'y':'ies')+'.</p>');
};
A.saveBucket=id=>{const n=$('#bk_n').value.trim();if(!n){toast('Enter a name.');return}S.buckets.find(x=>x.id===id).name=n;save();closeModal();render()};
A.delBucket=id=>{if(!arm('bk'+id,'Tap Delete again to confirm.'))return;S.sav=S.sav.filter(e=>e.bucket!==id);S.buckets=S.buckets.filter(b=>b.id!==id);save();closeModal();render()};
A.savEntry=id=>{
  if(!S.buckets.length){toast('Add a bucket first.');return}
  const e=id?S.sav.find(x=>x.id===id):null;
  if(e&&e.xfer){
    const pair=S.sav.filter(x=>x.xfer===e.xfer);
    modal('<h3>Move between buckets</h3><p class="mut">'+e.date.slice(5).replace('-','/')+' · '+pair.map(x=>esc(bName(x.bucket))+' '+(x.amount>0?'+':'')+yen(x.amount)).join(', ')+'</p><div class="row"><button class="dng" onclick="A.delSav(\''+id+'\')">Delete</button><button onclick="closeModal()">Close</button></div>');return;
  }
  const dflt=S.month===ym(new Date())?today():S.month+'-01';
  modal('<h3>'+(e?'Edit entry':'Savings entry')+'</h3>'+(e?'':'<label>What happened</label><select id="s_type" onchange="A.savType()"><option value="in">Deposit</option><option value="out">Withdrawal</option><option value="move">Move between buckets</option></select>')+
  '<label>Date</label><input type="date" id="s_date" value="'+(e?e.date:dflt)+'"><label id="s_bl">Bucket</label><select id="s_b">'+bOpts(e?e.bucket:'')+'</select><div id="s_tobox" hidden><label>To bucket</label><select id="s_to">'+bOpts(S.buckets[1]?S.buckets[1].id:'')+'</select></div><label>Amount (yen)</label><input id="s_amt" inputmode="numeric" value="'+(e?Math.abs(e.amount):'')+'"><label>Note (optional)</label><input id="s_note" value="'+esc(e?e.note:'')+'">'+
  '<div class="row" style="margin-top:14px"><button class="pri grow" onclick="A.saveSav(\''+(id||'')+'\')">Save</button>'+(e?'<button class="dng" onclick="A.delSav(\''+id+'\')">Delete</button>':'')+'<button onclick="closeModal()">Cancel</button></div>');
};
A.savType=()=>{const mv=$('#s_type').value==='move';$('#s_tobox').hidden=!mv;$('#s_bl').textContent=mv?'From bucket':'Bucket'};
A.saveSav=id=>{
  const e=id?S.sav.find(x=>x.id===id):null;
  const type=e?(e.amount<0?'out':'in'):$('#s_type').value;
  const date=$('#s_date').value,b=$('#s_b').value,amt=parseAmt($('#s_amt').value),note=$('#s_note').value.trim();
  if(!date||!amt||amt<=0){toast('Enter a date and an amount.');return}
  if(type==='move'){
    const to=$('#s_to').value;if(to===b){toast('Pick two different buckets.');return}
    const x=uid();S.sav.push({id:uid(),date:date,bucket:b,amount:-amt,note:note,xfer:x},{id:uid(),date:date,bucket:to,amount:amt,note:note,xfer:x});
  }else if(e)Object.assign(e,{date:date,bucket:b,amount:(type==='out'?-amt:amt),note:note});
  else S.sav.push({id:uid(),date:date,bucket:b,amount:(type==='out'?-amt:amt),note:note});
  save();closeModal();render();
};
A.delSav=id=>{
  if(!arm('sv'+id,'Tap Delete again to confirm.'))return;
  const e=S.sav.find(x=>x.id===id);if(!e)return;
  S.sav=e.xfer?S.sav.filter(x=>x.xfer!==e.xfer):S.sav.filter(x=>x.id!==id);
  save();closeModal();render();
};
A.allocate=()=>{
  if(!S.buckets.length){toast('Add a bucket first.');return}
  ui.alloc={left:monthStats(S.month).left};
  modal('<h3>Allocate savings</h3><p class="mut" id="al_l"></p>'+S.buckets.map(b=>'<label>'+esc(b.name)+' (now '+yen(bBal(b.id))+')</label><input id="al_'+b.id+'" inputmode="numeric" placeholder="0" oninput="A.alRem()">').join('')+'<div class="row" style="margin-top:14px"><button class="pri grow" onclick="A.alSave()">Save</button><button onclick="closeModal()">Cancel</button></div>');
  A.alRem();
};
A.alRem=()=>{const t=sum(S.buckets.map(b=>parseAmt($('#al_'+b.id).value)||0)),r=ui.alloc.left-t,e=$('#al_l');e.textContent='Left to allocate: '+yen(ui.alloc.left)+' · after this: '+yen(r);e.className=r<0?'wn':'mut'};
A.alSave=()=>{
  const d=(S.month===ym(new Date()))?today():S.month+'-'+pad(dim(S.month));let n=0;
  S.buckets.forEach(b=>{const a=parseAmt($('#al_'+b.id).value)||0;if(a>0){S.sav.push({id:uid(),date:d,bucket:b.id,amount:a,note:'Allocated from '+monthLabel(S.month)});n++}});
  if(!n){toast('Enter an amount for at least one bucket.');return}
  save();closeModal();render();toast('Saved to buckets');
};

// ---------- Month summary ----------
A.summary=()=>{
  const m=S.month,st=monthStats(m);
  const over=st.rows.filter(r=>r.a>r.b).sort((x,y)=>(y.a-y.b)-(x.a-x.b)).slice(0,5);
  const under=st.rows.filter(r=>r.b>r.a).sort((x,y)=>(y.b-y.a)-(x.b-x.a)).slice(0,5);
  const nn=S.tx.filter(t=>t.date.startsWith(m)&&t.from!=='shared'&&!t.cat);
  const li=(r,o)=>'<div class="tx" style="cursor:default"><div class="grow"><div class="m">'+esc(r.c.name)+'</div><div class="mut">'+yen(r.b)+' budget · '+yen(r.a)+' spent</div></div><div class="'+(o?'wn':'ok')+'" style="white-space:nowrap">'+yen(Math.abs(r.a-r.b))+(o?' over':' under')+'</div></div>';
  modal('<h3>'+monthLabel(m)+' summary</h3><div class="met"><div><small>Budget accuracy</small><b>'+(st.acc===null?'–':st.acc+'%')+'</b></div><div><small>Left to allocate</small><b class="'+(st.left<0?'wn':'')+'">'+yen(st.left)+'</b></div><div><small>Budgeted</small><b>'+yen(st.totB)+'</b></div><div><small>Spent</small><b>'+yen(st.totA)+'</b></div></div><p class="mut">Accuracy shows how close your budget was to what you spent, category by category. Going over and going under both lower it.</p>'+
  '<h3 style="margin:14px 0 6px">Furthest over budget</h3>'+(over.length?'<div class="card">'+over.map(r=>li(r,true)).join('')+'</div>':'<p class="mut">Nothing went over budget.</p>')+
  '<h3 style="margin:14px 0 6px">Most left unspent</h3>'+(under.length?'<div class="card">'+under.map(r=>li(r,false)).join('')+'</div>':'<p class="mut">No unspent budget.</p>')+
  (nn.length?'<p class="wn">'+nn.length+' transaction'+(nn.length>1?'s':'')+' ('+yen(sum(nn.map(t=>t.amount)))+') still need a category and count against accuracy.</p>':'')+
  '<p class="mut">Savings this month: '+yen(st.dep)+' put in, '+yen(st.wd)+' taken out.</p><div class="row" style="margin-top:12px"><button class="pri grow" onclick="closeModal();A.allocate()">Allocate savings</button><button onclick="closeModal()">Close</button></div>');
};

if(typeof document!=='undefined'&&document.getElementById('app')){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
}
</script>

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
